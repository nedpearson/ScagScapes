name: tests
on: [push, pull_request]
jobs:
  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: type-check the edge function
        run: deno check supabase/functions/ss-api/index.ts
      - name: unit tests (pure functions, no network)
        run: deno test --allow-env supabase/functions/ss-api/tests.ts
      - name: front-end script parses
        run: |
          node -e "const h=require('fs').readFileSync('index.html','utf8');const m=h.match(/<script>\(function\(\)\{([\s\S]*?)\}\)\(\);\n<\/script>/);new Function(m[1]);console.log('ok')"
